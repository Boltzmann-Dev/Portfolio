<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>My Website</title>
    <link rel="stylesheet" href="styles.css">

  </head>
  <body>

    <h1>Hello</h1>

    <input type="checkbox">

    <button style=":active color:red;">Click Me</button>

    <ul>
      <li class="list">
        <a href="https://www.google.com">Google</a>
      </li>
      <li class="list">Second</li>
      <li class="list">Third</li>
      
    </ul>
    <script>
      var sec = document.querySelectorAll(".list")[1];
      sec.style.visibility="hidden";
      sec.style.background="red";
      sec.style.visibility="visible";
      sec.classList.add("secondo");
      document.querySelector(".secondo").style.color="white";
      sec.classList.remove("secondo");
      ///document.querySelector(".secondo").style.background="black";
      sec.innerHTML="<button>Second</button>";
    </script>
  </body>

</html>
